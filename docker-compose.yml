# FrostWolf Hunter — local bundle.
#
# Runs the Hunter agent on THIS machine and writes everything to PRODUCTION.
# There is NO local database, NO local Redis, and NO local control plane: storage
# is prod D1, reached through the gateway worker, and every record is stamped with
# FW_ORG_ID so prod knows which org it belongs to.
#
# One hunt per invocation (the agent clones the repo, runs the pipeline, writes the
# connection/hunt/run/events/findings to prod, then exits):
#
#   FW_ORG_ID=<org> HUNTER_SECRET=<prod shared secret> MATTERAI_API_KEY=<key> \
#     REPO_URL=https://github.com/<org>/<repo> docker compose run --rm hunter
#
services:
  hunter:
    build:
      context: .
      dockerfile: Dockerfile
    # A one-shot agent: it runs a single hunt and exits, so it must NOT auto-restart
    # (that would re-run the hunt forever). The long-running engine that auto-restarts
    # is the GCP deployment, not this local bundle.
    restart: "no"
    environment:
      # --- prod connection (nothing local) -----------------------------------
      WORKER_URL: ${WORKER_URL:-https://api.frostwolf.app} # prod gateway -> prod D1
      HUNTER_SECRET: ${HUNTER_SECRET:?set the prod shared secret}
      FW_ORG_ID: ${FW_ORG_ID:?set your org id; every record is stored under it}
      # --- models ------------------------------------------------------------
      MATTERAI_BASE_URL: ${MATTERAI_BASE_URL:-https://api2.matterai.so/v1}
      MATTERAI_API_KEY: ${MATTERAI_API_KEY:?set the model API key}
      ATTACKER_MODEL: ${ATTACKER_MODEL:-frost-abliterated-cyber-max-1}
      VERIFIER_MODEL: ${VERIFIER_MODEL:-frost-abliterated-cyber-max-1}
      VERIFY_N: ${VERIFY_N:-1}
      # --- generator runtime + judge -----------------------------------------
      AGENT_RUNTIME: ${AGENT_RUNTIME:-orbcode}
      # orbcode is bundled in the image; ORBCODE_BIN defaults to its install path.
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-skip}
    command: ["node", "scripts/run-and-push.mjs", "${REPO_URL:?set REPO_URL to the public repo to hunt}"]
