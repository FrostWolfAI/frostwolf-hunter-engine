# FrostWolf Hunter — local bundle.
#
# One always-on HTTP service, nothing local. No Redis, no queue, no local database:
# a hunt is started by a direct API call and runs in the engine process, and all
# state is written to PROD D1 through the gateway worker. The org that owns a hunt
# is the `x-fw-tenant` on the API call.
#
#   docker compose up -d --build         # start the engine on :6888 (auto-restarts)
#
# Then drive it over its API (the shared secret as bearer, your org as the tenant):
#   S=$HUNTER_SECRET; T=<your-org-id>; H="-H authorization:Bearer\ $S -H x-fw-tenant:$T"
#   C=$(curl -s $H -H content-type:application/json localhost:6888/v1/hunter/connections \
#         -d '{"provider":"github","repos":["<org>/<repo>"]}' | jq -r .connection.id)
#   HUNT=$(curl -s $H -H content-type:application/json localhost:6888/v1/hunter/hunts \
#         -d "{\"connection_id\":\"$C\",\"scope\":{\"repo\":\"https://github.com/<org>/<repo>\"}}" | jq -r .hunt.id)
#   RUN=$(curl -s $H -X POST localhost:6888/v1/hunter/hunts/$HUNT/start | jq -r .run.id)
#   curl -s $H localhost:6888/v1/hunter/runs/$RUN/stream   # live log (SSE)
#
services:
  hunter:
    build:
      context: .
      dockerfile: Dockerfile
    # Always-on HTTP service: the gateway worker proxies /v1/hunter/* to it, and it
    # writes back to D1 through the worker's /internal/d1. Run the service, not the
    # one-shot script.
    command: ["node", "dist/index.js"]
    restart: unless-stopped
    environment:
      PORT: "6888"
      # --- prod connection (nothing local) -----------------------------------
      WORKER_URL: ${WORKER_URL:-https://api.frostwolf.app} # prod gateway -> prod D1
      HUNTER_SECRET: ${HUNTER_SECRET:?set the prod shared secret}
      # --- models ------------------------------------------------------------
      MATTERAI_BASE_URL: ${MATTERAI_BASE_URL:-https://api2.matterai.so/v1}
      MATTERAI_API_KEY: ${MATTERAI_API_KEY:?set the model API key}
      ATTACKER_MODEL: ${ATTACKER_MODEL:-frost-abliterated-cyber-max-1}
      VERIFIER_MODEL: ${VERIFIER_MODEL:-frost-abliterated-cyber-max-1}
      VERIFY_N: ${VERIFY_N:-1}
      # --- generator runtime + judge -----------------------------------------
      AGENT_RUNTIME: ${AGENT_RUNTIME:-orbcode}
      # orbcode is bundled in the image; ORBCODE_BIN defaults to its install path.
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-skip}
    ports:
      - "6888:6888" # the Hunter API, reachable from the host
